[package]
name = "tensorfsd"
version = "0.1.0"
description = "The TensorFS daemon: mounted snapshot and workspace filesystems"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tensorfs-core = { path = "../tensorfs-core" }
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# abi-7-31 unlocks FUSE_MAX_PAGES (1 MiB requests) and FUSE_WRITEBACK_CACHE
# while keeping default-features off, so the mount path stays pure-Rust
# (fusermount3) with no libfuse/pkg-config build dependency.
fuser = { version = "0.15", default-features = false, features = ["abi-7-31"] }
libc = "0.2"
nix = { version = "0.30", default-features = false, features = ["socket", "user", "signal", "fs"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook = "0.3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
memmap2 = "0.9"
