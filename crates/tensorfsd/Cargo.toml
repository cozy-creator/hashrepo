[package]
name = "tensorfsd"
version = "0.1.0"
description = "The TensorFS daemon: mounted snapshot and workspace filesystems"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tensorfs-core = { path = "../tensorfs-core" }
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.15", default-features = false }
libc = "0.2"
nix = { version = "0.30", default-features = false, features = ["socket", "user"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook = "0.3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
