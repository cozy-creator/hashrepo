[package]
name = "tensorfs-core"
version = "0.1.0"
description = "Canonical formats and storage engine for TensorFS"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true

[target.'cfg(any(unix, windows))'.dependencies]
base64 = "0.22"
fs4 = { version = "0.8", default-features = false, features = ["sync"] }
turso = { version = "0.7.2", default-features = false }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# rusqlite is kept ONLY to prove the escape hatch: tests/engine_reopen.rs
# opens the same metadata file under both engines. It is gated to the
# platforms that module targets so a wasm build never resolves its
# sqlite-wasm-rs backend.
[target.'cfg(any(unix, windows))'.dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
