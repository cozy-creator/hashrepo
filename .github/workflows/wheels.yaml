name: wheels

# The platform wheel matrix, plus the sdist that covers everything outside it.
#
# It is callable three ways on purpose:
#   * workflow_call  -- publish.yaml runs it on a release tag
#   * workflow_dispatch -- run the whole matrix on demand without tagging
#   * pull_request   -- any PR touching the build runs it, so the matrix
#                       cannot rot silently between releases. Tagging is far
#                       too late to discover that a runner label moved or a
#                       target stopped cross-compiling.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "python/**"
      - ".github/workflows/wheels.yaml"

permissions:
  contents: read

env:
  # abi3-py311: one wheel per platform serves every CPython from 3.11 up.
  MATURIN_ARGS: --release --out dist

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in maturin's manylinux/musllinux containers so
          # the extension links the libc the wheel tag claims.
          - name: manylinux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - name: manylinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          - name: musllinux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - name: musllinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          # Native runners for every architecture. No QEMU anywhere: emulated
          # Rust builds are slow enough to dominate the release.
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          # NO WINDOWS WHEEL, and it is not a build problem -- both Windows
          # cells built cleanly on an earlier branch, including arm64. The
          # blocker is the library: `python/src/tensorfs/local.py` imports
          # `fcntl` at module scope for advisory locking, `__init__.py`
          # imports it eagerly, so `import tensorfs` raises
          # ModuleNotFoundError on Windows and always has. Shipping a wheel
          # whose top-level import fails is worse than shipping none.
          #
          # Restoring Windows needs a real POSIX-lock replacement in local.py
          # (`msvcrt.locking` is byte-range and has no shared mode, so it is
          # not a drop-in), not a matrix edit. The mapping half is already
          # portable: reads go through the extension's `MappedObject` rather
          # than Python's POSIX-flagged `mmap`, and memmap2 covers Windows.
          # Windows users can build from the sdist meanwhile.
          # macOS is unaffected: it has flock, and both macOS smokes pass.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: ${{ env.MATURIN_ARGS }}
          sccache: "true"

      - name: The wheel is abi3, typed, and carries no daemon
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          echo "built ${wheel} ($(du -h "${wheel}" | cut -f1))"

          # One wheel per platform, not one per interpreter version. If this
          # ever reads cp311-cp311 the abi3 feature stopped applying and the
          # matrix silently needs five times as many entries.
          case "${wheel}" in
            *-abi3-*) ;;
            *) echo "::error::${wheel} is not an abi3 wheel"; exit 1 ;;
          esac

          python3 - "${wheel}" <<'PY'
          import sys, zipfile

          wheel = sys.argv[1]
          names = set(zipfile.ZipFile(wheel).namelist())

          assert any(n.startswith("tensorfs/_tensorfs") for n in names), sorted(names)[:20]
          assert "tensorfs/py.typed" in names, "py.typed did not ship"
          assert "tensorfs/_tensorfs.pyi" in names, "the extension stub did not ship"

          # Every platform ships the same thing. The FUSE daemon is not in it:
          # pods cannot mount FUSE, and the daemon is shelved on the
          # `shelf/tensorfsd` branch. A stray binary from a dirty build tree
          # would otherwise ride along unseen.
          strays = sorted(n for n in names if n.startswith("tensorfs/_bin/"))
          assert not strays, f"the wheel carries an unshipped binary: {strays}"
          print(f"{wheel}: abi3, py.typed, stub, no daemon")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Merging the facade and the extension into one distribution gives up the
  # fallback HuggingFace gets from splitting `huggingface_hub` from `hf_xet`:
  # a platform outside the matrix can no longer install a pure-Python wheel.
  # The sdist IS that fallback, so it is gated, not assumed.
  #
  # It runs on Linux AND on macOS, and the macOS arm is not redundant with the
  # macOS wheel smoke. The sdist is the fallback for every platform outside
  # the wheel matrix, and every one of those platforms is non-Linux; testing
  # the fallback only on the platform that never needs it proves the least
  # interesting case. macOS is the non-Linux host CI can express -- it is
  # where a POSIX-but-not-Linux source build (`fcntl`, `flock`, the darwin
  # target's C toolchain) actually gets compiled. Windows remains uncovered
  # and is refused by name at import; see the matrix comment above.
  sdist-installs-from-source:
    name: sdist builds and installs from source (${{ matrix.name }})
    needs: sdist
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-24.04
          - name: macos
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Install the sdist into a clean venv and use it
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/from-sdist
          /tmp/from-sdist/bin/pip install --quiet --upgrade pip
          /tmp/from-sdist/bin/pip install --no-binary :all: dist/tensorfs-*.tar.gz
          cd /tmp
          /tmp/from-sdist/bin/python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from tensorfs import (
              LocalCAS,
              RepositoryManifest,
              TensorWriter,
              open_tensors,
          )
          from tensorfs.native import FileRecord, MappedObject, ObjectStore, RecordsReader

          with TemporaryDirectory() as root:
              store = ObjectStore(Path(root))
              admitted = store.put_bytes(b"sdist-built")
              assert store.read_object(admitted.digest) == b"sdist-built"
              reader = RecordsReader(
                  store, [FileRecord.data(admitted.digest, admitted.length)]
              )
              assert reader.read_at(0, reader.length) == b"sdist-built"

          with TemporaryDirectory() as root:
              cas = LocalCAS(Path(root))
              ref = cas.put_bytes(b"sdist-facade")
              assert cas.verify_object(ref).read_bytes() == b"sdist-facade"

          body = bytes(range(32))
          with TemporaryDirectory() as root:
              cas = LocalCAS(Path(root))
              writer = TensorWriter(cas, "model.safetensors")
              writer.add("block.0.weight", "F32", (2, 4), body)
              with open_tensors(cas, RepositoryManifest((writer.finish(),))) as tensors:
                  view = tensors["block.0.weight"]
                  assert view.tobytes() == body
                  # A source build exports the same zero-copy buffer a wheel
                  # does -- the abi3 floor is a property of the crate, not of
                  # who compiled it.
                  piece = next(view.pieces())
                  assert isinstance(piece.obj, MappedObject) and piece.readonly

          print("the sdist builds from source and works")
          PY

  smoke:
    name: smoke ${{ matrix.name }}
    needs: wheels
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every wheel the matrix builds gets installed and used somewhere.
          # A built-but-never-installed wheel is an untested wheel, and the
          # musllinux and arm64-Windows cells are exactly where a packaging
          # mistake would hide. musllinux is covered by `smoke-musl` below,
          # which needs a container rather than a runner.
          - name: manylinux-x86_64
            runner: ubuntu-24.04
          - name: manylinux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-x86_64
            runner: macos-15-intel
          - name: macos-aarch64
            runner: macos-15
    steps:
      # TWO interpreters, and which two is the point. `abi3-py311` claims one
      # wheel serves every CPython from 3.11 up; installing it only on the
      # version it happened to be built against tests none of that claim. The
      # floor is where an abi3 mistake actually surfaces.
      - uses: actions/setup-python@v5
        id: floor
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v5
        id: newest
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/

      - name: Write the smoke script
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/smoke.py" <<'PY'
          import sys
          from importlib.resources import files
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from tensorfs import (
              LocalCAS,
              RepositoryManifest,
              TensorWriter,
              native,
              open_tensors,
          )

          # The pure-Python facade is untouched by this change.
          assert files("tensorfs").joinpath("py.typed").is_file()
          with TemporaryDirectory() as root:
              cas = LocalCAS(Path(root))
              ref = cas.put_bytes(b"release-smoke")
              assert cas.verify_object(ref).read_bytes() == b"release-smoke"

          # The compiled half is really compiled, and really works.
          extension = Path(sys.modules["tensorfs._tensorfs"].__file__)
          assert extension.suffix in {".so", ".pyd", ".dylib"}, extension
          with TemporaryDirectory() as root:
              store = native.ObjectStore(Path(root))
              admitted = store.put_bytes(b"native-smoke")
              assert store.read_object(admitted.digest) == b"native-smoke"
              assert store.verify(admitted.digest) == admitted.length
              reader = native.RecordsReader(
                  store, [native.FileRecord.data(admitted.digest, admitted.length)]
              )
              assert reader.read_at(0, reader.length) == b"native-smoke"

          # An import smoke does not prove the extension works, and neither
          # does a CAS round trip: what the wheel exists to deliver is a
          # NAMED TENSOR read out of a committed snapshot without a file. So
          # write two tensors, read one back, and check the borrow.
          weight = bytes(range(32))
          bias = bytes(range(32, 48))
          with TemporaryDirectory() as root:
              cas = LocalCAS(Path(root))
              writer = TensorWriter(cas, "model.safetensors")
              writer.add("block.0.weight", "F32", (2, 4), weight)
              writer.add("block.0.bias", "F32", (4,), bias)
              manifest = RepositoryManifest((writer.finish(),))
              with open_tensors(cas, manifest) as tensors:
                  assert sorted(tensors) == ["block.0.bias", "block.0.weight"]
                  view = tensors["block.0.weight"]
                  assert view.dtype == "F32" and view.shape == (2, 4), view
                  assert view.tobytes() == weight
                  assert tensors["block.0.bias"].tobytes() == bias
                  # Zero copy, and it is the EXTENSION's zero copy: the piece
                  # is a window into a `MappedObject`, which exports the
                  # mapping through `Py_buffer`. This is the whole abi3
                  # question -- whether the C buffer protocol is expressible
                  # under the Limited API at the 3.11 floor -- answered by a
                  # built wheel on the floor interpreter rather than by
                  # reading `Misc/stable_abi.toml`.
                  piece = next(view.pieces())
                  assert piece.readonly
                  assert isinstance(piece.obj, native.MappedObject), type(piece.obj)
                  assert any(piece.obj is m for m in tensors._maps.values())

          # The export, taken directly and proved to be the mapping rather
          # than a copy: edit the file underneath a live view and the view
          # must see it. A copy cannot.
          with TemporaryDirectory() as root:
              probe = Path(root) / "object"
              probe.write_bytes(b"\0" * 32)
              held = memoryview(native.MappedObject(probe))
              assert held.obj is not None and held.readonly and held.format == "B"
              with probe.open("r+b") as handle:
                  handle.write(b"\xff" * 8)
              assert bytes(held[:8]) == b"\xff" * 8, "the extension copied instead of mapping"
              assert bytes(native.MappedObject(probe)) == bytes(held)

          # Every platform ships the same thing, and the FUSE daemon is not
          # part of it -- pods cannot mount FUSE; the daemon is shelved on
          # the `shelf/tensorfsd` branch.
          assert not (extension.parent / "_bin").exists(), "the wheel carries an unshipped binary"
          print(f"wheel smoke passed on {sys.version.split()[0]}")
          PY

      # Everything the previous publish workflow proved about the pure-Python
      # wheel, still proved -- plus the equivalents for the compiled half, on
      # both ends of the range one abi3 wheel claims to cover.
      - name: Install into clean venvs and prove the guarantees
        shell: bash
        run: |
          set -euo pipefail
          for interpreter in \
            "${{ steps.floor.outputs.python-path }}" \
            "${{ steps.newest.outputs.python-path }}"; do
            tag="$("${interpreter}" -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
            venv="${RUNNER_TEMP}/wheel-smoke-${tag}"
            "${interpreter}" -m venv "${venv}"
            "${venv}/bin/python" -m pip install --quiet --upgrade pip
            "${venv}/bin/python" -m pip install --quiet dist/*.whl mypy
            (cd "${RUNNER_TEMP}" && "${venv}/bin/python" smoke.py)

            # Typing must survive the extension boundary. PyO3 emits no type
            # information, so this passes only because `_tensorfs.pyi` ships.
            (cd "${RUNNER_TEMP}" \
              && "${venv}/bin/python" -m mypy --strict -c 'from tensorfs import LocalCAS' \
              && "${venv}/bin/python" -m mypy --strict -c 'from tensorfs.native import ObjectStore, RecordsReader, FileRecord' \
              && "${venv}/bin/python" -m mypy --strict -c 'from tensorfs.native import MappedObject; v: memoryview = memoryview(MappedObject("o"))')
          done


  # GitHub has no musl runner, so the musllinux wheels are installed inside an
  # Alpine container instead. Without this, two of the six wheels would ship
  # having never been imported once.
  #
  # The container is driven with an explicit `docker run` rather than the job's
  # `container:` key, because GitHub runs its JavaScript actions INSIDE that
  # container and "JavaScript Actions in Alpine containers are only supported
  # on x64 Linux runners" -- which fails the aarch64 half, exactly the cell
  # least likely to be covered anywhere else. Downloading on the host and
  # mounting the result sidesteps it and works identically on both arches.
  smoke-musl:
    name: smoke ${{ matrix.name }}
    needs: wheels
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: musllinux-x86_64
            runner: ubuntu-24.04
          - name: musllinux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/

      - name: Write the smoke script
        shell: bash
        run: |
          set -euo pipefail
          cat > smoke.py <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from tensorfs import (
              LocalCAS,
              RepositoryManifest,
              TensorWriter,
              native,
              open_tensors,
          )

          with TemporaryDirectory() as root:
              cas = LocalCAS(Path(root))
              ref = cas.put_bytes(b"musl-smoke")
              assert cas.verify_object(ref).read_bytes() == b"musl-smoke"

          with TemporaryDirectory() as root:
              store = native.ObjectStore(Path(root))
              admitted = store.put_bytes(b"musl-native")
              assert store.read_object(admitted.digest) == b"musl-native"
              reader = native.RecordsReader(
                  store, [native.FileRecord.data(admitted.digest, admitted.length)]
              )
              assert reader.read_at(0, reader.length) == b"musl-native"

          # And the thing the wheel is FOR: a named tensor out of a committed
          # snapshot, with no file anywhere.
          body = bytes(range(32))
          with TemporaryDirectory() as root:
              cas = LocalCAS(Path(root))
              writer = TensorWriter(cas, "model.safetensors")
              writer.add("block.0.weight", "F32", (2, 4), body)
              with open_tensors(cas, RepositoryManifest((writer.finish(),))) as tensors:
                  view = tensors["block.0.weight"]
                  assert view.dtype == "F32" and view.shape == (2, 4), view
                  assert view.tobytes() == body
                  piece = next(view.pieces())
                  assert isinstance(piece.obj, native.MappedObject) and piece.readonly

          print("musl wheel works")
          PY

      - name: Install the musl wheel under Alpine and use it
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "${PWD}:/work" -w /work alpine:3.21 sh -eu -c '
            apk add --no-cache python3 >/dev/null
            python3 -m venv /tmp/musl-smoke
            /tmp/musl-smoke/bin/pip install --quiet dist/*.whl
            /tmp/musl-smoke/bin/python smoke.py
          '
