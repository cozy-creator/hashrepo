name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The mount tests hand a mounted path to the real safetensors library.
      # Without this they skip loudly rather than pass vacuously.
      - name: Install the safetensors reader
        run: |
          python3 -m venv /tmp/safetensors-reader
          /tmp/safetensors-reader/bin/pip install --quiet 'safetensors>=0.4' 'numpy>=1.26'
      - run: cargo test --workspace --all-features
        env:
          TENSORFS_TEST_PYTHON: /tmp/safetensors-reader/bin/python3
      - run: cargo check --workspace --all-targets --all-features --target wasm32-unknown-unknown

  rust-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check python
      - run: uv run mypy
      - run: uv run pytest
      - name: Verify installed-wheel typing metadata
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel
          uv venv --python 3.12 /tmp/tensorfs-wheel
          uv pip install --python /tmp/tensorfs-wheel/bin/python dist/tensorfs-*.whl mypy
          cd /tmp
          /tmp/tensorfs-wheel/bin/mypy --strict -c 'from tensorfs import LocalCAS'

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
