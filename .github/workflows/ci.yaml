name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # tensorfs-py is excluded from --all-targets clippy and from cargo test
      # on purpose. It enables `pyo3/extension-module` by default, which
      # leaves CPython symbols undefined for the loading interpreter to
      # resolve -- correct for a cdylib, impossible for a test executable.
      # Its gate is the Python suite, which drives the real built extension.
      - run: cargo clippy --workspace --all-targets --all-features --exclude tensorfs-py -- -D warnings
      - run: cargo clippy -p tensorfs-py --lib -- -D warnings
      # The Python extension links tensorfs-core WITHOUT the sync client and
      # the metadata engine. If that partition stops holding, the wheel starts
      # carrying an HTTP stack and a SQL engine it never calls -- and the
      # cross-compile surface grows a C toolchain requirement with it.
      - run: cargo check -p tensorfs-core --no-default-features --features store --lib
      - run: cargo test --workspace --all-features --exclude tensorfs-py
      # PyO3 has no wasm target, so the extension crate is excluded here too.
      - run: cargo check --workspace --all-targets --all-features --exclude tensorfs-py --target wasm32-unknown-unknown

  # macOS and Windows build ONE crate on purpose.
  #
  # tensorfs-core has real per-platform code -- store.rs opens objects with
  # O_NOFOLLOW on Unix and pays a symlink stat on Windows because Windows
  # cannot refuse traversal at open, and fsync_dir seals a rename on POSIX
  # only -- so running it on both runners is genuine coverage.
  core-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung test must cost minutes, not a runner-day. The hang that bought
    # this bound is fixed (#109 — a Windows racing-removal panic in a thread
    # nothing else could hear, leaving its worker spinning), so the bound is
    # now what it should always have been: a blast radius, not a workaround.
    # The suite itself runs in eight.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: tensorfs-core tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p tensorfs-core --all-features 2>&1 | tee core-tests.log
          passed=$(grep -oE 'test result: ok\. [0-9]+ passed' core-tests.log |
            grep -oE '[0-9]+ passed' |
            awk '{ total += $1 } END { print total + 0 }')
          echo "tensorfs-core: ${passed} tests passed on ${RUNNER_OS}"
          # A floor, not an exact count. It catches this job going vacuously
          # green the way the (since-shelved) daemon matrix once did -- a new
          # cfg gate emptying it rather than ordinary test churn.
          if [ "${passed}" -lt 100 ]; then
            echo "::error::only ${passed} tensorfs-core tests ran on ${RUNNER_OS}; the floor is 100"
            echo "This job exists to execute real cross-platform code. If a cfg gate just"
            echo "emptied it, fix the gate rather than lowering the floor."
            exit 1
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      # The project is no longer pure Python: installing it compiles the
      # extension, so the Python job needs a Rust toolchain.
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: uv sync --all-extras
      - run: uv run ruff check python
      - run: uv run mypy
      - run: uv run pytest
      - name: Verify installed-wheel typing metadata
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel
          uv venv --python 3.12 /tmp/tensorfs-wheel
          uv pip install --python /tmp/tensorfs-wheel/bin/python dist/tensorfs-*.whl mypy
          cd /tmp
          /tmp/tensorfs-wheel/bin/mypy --strict -c 'from tensorfs import LocalCAS'
          # Typing has to survive the extension boundary too. PyO3 emits none,
          # so this passes only because `_tensorfs.pyi` ships in the wheel.
          /tmp/tensorfs-wheel/bin/mypy --strict -c 'from tensorfs.native import ObjectStore, RecordsReader'
          # The buffer export has to type-check as a buffer, which is what the
          # stub's `__buffer__` promises across the extension boundary.
          /tmp/tensorfs-wheel/bin/mypy --strict -c 'from tensorfs.native import MappedObject; v: memoryview = memoryview(MappedObject("o"))'

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
