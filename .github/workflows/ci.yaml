name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check python
      - run: uv run mypy
      - run: uv run pytest
      - name: Verify installed-wheel typing metadata
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel
          uv venv --python 3.12 /tmp/hashrepo-wheel
          uv pip install --python /tmp/hashrepo-wheel/bin/python dist/hashrepo-*.whl mypy
          cd /tmp
          /tmp/hashrepo-wheel/bin/mypy --strict -c 'from hashrepo import LocalCAS'

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
