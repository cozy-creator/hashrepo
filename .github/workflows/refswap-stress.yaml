name: refswap-stress

# TEMPORARY (#103 follow-up): re-measures the Windows ref-swap flake rate with
# no retry inside the library. Deleted before this merges.

on:
  workflow_dispatch:
  push:
    branches: [103-scrub-never-spins]

permissions:
  contents: read

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: ref swap and racing scrub, 20 runs
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p tensorfs-core --all-features --test projection --test gc \
            --no-run --message-format=json > build.json
          swap=$(jq -r 'select(.reason == "compiler-artifact")
            | select(.target.name == "projection") | .executable // empty' build.json | tail -1)
          race=$(jq -r 'select(.reason == "compiler-artifact")
            | select(.target.name == "gc") | .executable // empty' build.json | tail -1)
          failed=0
          for run in $(seq 1 20); do
            "${swap}" --exact a_ref_swap_is_atomic_under_concurrent_readers > run.log 2>&1 ||
              { failed=$((failed + 1))
                grep -E 'panicked|the ref was|a swap invalidated' run.log | head -3; }
            "${race}" --exact a_scrub_racing_a_deletion_never_costs_a_live_root > race.log 2>&1 ||
              { failed=$((failed + 1)); grep -E 'panicked|assert' race.log | head -3; }
          done
          echo "::notice::shard ${{ matrix.shard }}: ${failed} failures in 20 swap + 20 scrub-race runs"
