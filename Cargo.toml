[workspace]
members = ["crates/tensorfs-core", "crates/tensorfs-cuda", "crates/tensorfs-py"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/cozy-creator/tensorfs"
rust-version = "1.91"

# The release artifact ships to users inside a wheel -- the extension module
# -- so debug symbols are dead weight in every install. A backtrace from a
# released build names frames, not lines; reproduce against a local
# `cargo build --release` without this to debug.
[profile.release]
strip = "symbols"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
unicode-normalization = "0.1.24"
