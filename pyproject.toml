[project]
name = "tensorfs"
version = "0.4.0"
description = "Content-addressed local storage and resumable chunk transfer"
readme = "README.md"
license = "MIT"
authors = [{ name = "Paul Fidika", email = "paul@fidika.com" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/cozy-creator/tensorfs"
Issues = "https://github.com/cozy-creator/tensorfs/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=9.0",
    "ruff>=0.6",
]
# The real library the Rust mount tests hand a mounted path to, so the claim
# "safe_open works on a mounted path with no wrapper" is proved by safetensors
# itself. numpy is safe_open's only backend that does not pull a multi-GB
# deep-learning runtime; do not add torch here.
mount-tests = [
    "numpy>=1.26",
    "safetensors>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/src/tensorfs"]

[tool.hatch.build.targets.sdist]
include = [
    "python/src/tensorfs",
    "spec/v1",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["python/src", "python/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
