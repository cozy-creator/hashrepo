[project]
name = "hashrepo"
version = "0.3.1"
description = "Content-addressed local storage and resumable chunk transfer"
readme = "README.md"
license = "MIT"
authors = [{ name = "Paul Fidika", email = "paul@fidika.com" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/cozy-creator/hashrepo"
Issues = "https://github.com/cozy-creator/hashrepo/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=9.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/src/hashrepo"]

[tool.hatch.build.targets.sdist]
include = [
    "python/src/hashrepo",
    "spec/v1",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["python/src", "python/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
